---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.2
  name: harborprojects.goharbor.io
spec:
  group: goharbor.io
  names:
    categories:
    - goharbor
    kind: HarborProject
    listKind: HarborProjectList
    plural: harborprojects
    shortNames:
    - hp
    singular: harborproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Project name in Harbor
      jsonPath: .spec.projectName
      name: ProjectName
      type: string
    - description: HarborServerConfiguration name
      jsonPath: .spec.harborServerConfig
      name: HarborServerConfig
      type: string
    - description: HarborProject status
      jsonPath: .status.status
      name: Status
      type: string
    - description: Timestamp representing the server time when this object was created.
        It is not guaranteed to be set in happens-before order across separate operations.
        Clients may not set this value. It is represented in RFC3339 form and is in
        UTC.
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: HarborProject is the Schema for the harbors projects.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HarborProjectSpec defines the spec of HarborProject.
            properties:
              cveAllowList:
                description: The CVE allowlist for the project.
                items:
                  type: string
                type: array
              harborServerConfig:
                description: HarborServerConfig contains the name of a HarborServerConfig
                  resource describing the harbor instance to manage.
                type: string
              memberships:
                description: Group or user memberships of the project.
                items:
                  description: HarborProjectMember is a member of a HarborProject.
                    Can be a user or group.
                  properties:
                    name:
                      description: Name of the member. Has to match with a existing
                        user or group
                      type: string
                    role:
                      description: Role of the member in the Project. This controls
                        the member's permissions on the project.
                      enum:
                      - projectAdmin
                      - developer
                      - guest
                      - maintainer
                      type: string
                    type:
                      description: Type of the member, group or user
                      enum:
                      - group
                      - user
                      type: string
                  required:
                  - name
                  - role
                  - type
                  type: object
                type: array
              metadata:
                description: HarborProjectMetadata related configurations.
                properties:
                  autoScan:
                    description: Whether to scan images automatically after pushing.
                    type: boolean
                  enableContentTrust:
                    description: Whether content trust is enabled or not. If enabled,
                      user can't pull unsigned images from this project.
                    type: boolean
                  enableContentTrustCosign:
                    description: Whether cosign content trust is enabled or not. Similar
                      to enableContentTrust, but using cosign.
                    type: boolean
                  preventVulnerable:
                    description: Whether to prevent vulnerable images from running.
                    type: boolean
                  public:
                    description: The flag to indicate whether the project should be
                      public or not.
                    type: boolean
                  reuseSysCveAllowlist:
                    description: Whether this project reuses the system level CVE
                      allowlist for itself. If this is set to `true`, the actual allowlist
                      associated with this project will be ignored.
                    type: boolean
                  severity:
                    description: If an image's vulnerablilities are higher than the
                      severity defined here, the image can't be pulled. Can be either
                      `none`, `low`, `medium`, `high` or `critical`.
                    enum:
                    - none
                    - low
                    - medium
                    - high
                    - critical
                    type: string
                type: object
              projectName:
                description: The name of the harbor project. Has to match harbor's
                  naming rules.
                maxLength: 255
                minLength: 1
                pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
                type: string
              storageQuota:
                description: The project's storage quota in human-readable format,
                  like in Kubernetes memory requests/limits (Ti, Gi, Mi, Ki). The
                  Harbor's default value is used if empty.
                pattern: ^[1-9][0-9]*(Ti|Gi|Mi|Ki)$
                type: string
            required:
            - harborServerConfig
            - projectName
            type: object
          status:
            description: HarborProjectStatus defines the status of HarborProject.
            properties:
              lastApplyTime:
                description: LastApplyTime represents the last apply configuration
                  time.
                format: date-time
                type: string
              membershipHash:
                description: MembershipHash provides a way to quickly notice changes
                  in project membership.
                type: string
              message:
                description: Message provides human-readable message.
                type: string
              projectID:
                description: ProjectID represents ID of the managed project.
                format: int32
                type: integer
              quotaID:
                description: QuotaID is the ID of the project's quota. Used to be
                  able to update it.
                format: int64
                type: integer
              reason:
                description: Reason represents status reason.
                type: string
              status:
                description: Status represents harbor project status.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
